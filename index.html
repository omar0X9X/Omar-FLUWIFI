<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#060504">
  <meta name="description" content="ريل وثائقي سينمائي 9:16 عن هرم خوفو">
  <title>هرم خوفو — Cinematic Reel</title>
  <link rel="preconnect" href="https://commons.wikimedia.org">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="reel" id="reel" aria-label="ريل وثائقي عن هرم خوفو">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="letterbox-glow"></div>

    <div id="sceneMount" class="scene-mount" aria-live="polite"></div>

    <section class="text-layer" id="textLayer">
      <p id="kicker" class="kicker"></p>
      <h1 id="title" class="title"></h1>
      <p id="subtitle" class="subtitle"></p>
    </section>

    <div class="flash-cut" id="flashCut"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
