<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090806">
  <meta name="description" content="قصة تفاعلية سينمائية 9:16 عن هرم خوفو">
  <title>هرم خوفو — قصة تفاعلية 9:16</title>
  <link rel="preconnect" href="https://commons.wikimedia.org">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <div class="reel" id="reel" aria-label="وثائقي تفاعلي عن هرم خوفو">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>
      <div class="grain"></div>
      <div class="vignette"></div>

      <div class="brand">
        <span class="brand-mark">𓂀</span>
        <span>KHUFU / 2560 BC</span>
      </div>

      <div class="counter">
        <span id="sceneIndex">01</span>
        <span class="slash">/</span>
        <span id="sceneTotal">13</span>
      </div>

      <div id="sceneMount" class="scene-mount" aria-live="polite"></div>

      <div class="caption-zone">
        <div class="caption-kicker" id="kicker"></div>
        <h1 class="caption-title" id="title"></h1>
        <p class="caption-body" id="body"></p>
        <div class="fact-pill" id="fact"></div>
      </div>

      <div class="progress-wrap" aria-hidden="true">
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        <div id="chapterDots" class="chapter-dots"></div>
      </div>

      <div class="controls">
        <button id="prevBtn" class="control-btn" aria-label="المشهد السابق">‹</button>
        <button id="playBtn" class="control-btn control-main" aria-label="تشغيل أو إيقاف">▶</button>
        <button id="nextBtn" class="control-btn" aria-label="المشهد التالي">›</button>
        <button id="audioBtn" class="control-btn wide" aria-label="إضافة تعليق صوتي">🎙 أضف الصوت</button>
        <button id="fullscreenBtn" class="control-btn" aria-label="ملء الشاشة">⛶</button>
      </div>

      <input id="audioInput" type="file" accept="audio/*" hidden>
      <audio id="voiceover" preload="metadata" src="assets/voiceover.mp3"></audio>
    </div>

    <aside class="desktop-note">
      <strong>9:16</strong>
      <span>مصمم كفيديو عمودي 1080×1920</span>
      <span>اضغط تشغيل لبدء القصة</span>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
